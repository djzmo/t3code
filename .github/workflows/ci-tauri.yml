name: Tauri CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-tauri-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol-typescript:
    name: Tauri protocol (TypeScript)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Run protocol fixture round-trip tests
        run: >-
          vp test run
          apps/desktop/src/tauri/rpc/protocol.test.ts
          scripts/fetch-node-sidecar.test.ts
          scripts/tauri/check-remote-cli-pin.test.ts
          scripts/tauri/check-toolchain-alignment.test.ts
          scripts/tauri/version-grammar.test.ts

      - name: Verify immutable remote CLI pin
        env:
          INTEGRITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm --version | grep -E '^11\.'
          git remote add upstream https://github.com/pingdotgg/t3code.git
          node scripts/tauri/check-remote-cli-pin.ts --integrity-base-ref "$INTEGRITY_BASE_REF"

  protocol-rust:
    name: Tauri protocol (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
          - macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Run locked protocol tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Run locked Clippy checks
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
