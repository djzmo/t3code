[package]
name = "agent-nanoni-desktop"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
muda = "=0.19.3"
tauri = { version = "=2.11.5", default-features = false, features = [
  "wry",
  "compression",
  "common-controls-v6",
  "dynamic-acl",
  "x11",
  "dbus",
] }
thiserror = "2.0"

[build-dependencies]
tauri-build = "=2.6.3"
