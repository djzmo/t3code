[package]
name = "agent-nanoni-desktop"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[features]
default = []
topology-a-pilot = ["dep:tauri-plugin-pilot"]

[dependencies]
dunce = "=1.0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
muda = "=0.19.3"
tauri = { version = "=2.11.5", default-features = false, features = [
  "wry",
  "compression",
  "common-controls-v6",
  "dynamic-acl",
  "x11",
  "dbus",
] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-pilot = { version = "=0.7.2", default-features = false, optional = true }
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
command-fds = "=0.3.3"
nix = { version = "=0.31.2", features = ["fs", "process", "signal"] }
rustix = { version = "=1.1.4", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"

[build-dependencies]
tauri-build = "=2.6.3"
